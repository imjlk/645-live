name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check web app
        run: bun run www check

      - name: Build web app
        run: bun run www build

      - name: Check SDK
        run: bun run sdk check

      - name: Build SDK
        run: bun run sdk build

      - name: Check TrailBase adapter
        run: bun --cwd packages/trailbase-adapter -- type-check

      - name: Test TrailBase adapter
        run: bun --cwd packages/trailbase-adapter -- test --run
