name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRAILBASE_URL: https://trail.645.live
      PUBLIC_TRAILBASE_URL: https://trail.645.live
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check web app
        run: bun run www check

      - name: Build web app
        run: bun run www build

      - name: Test static serving and request boundaries
        run: bun test pages/www/adapter/worker.test.ts pages/www/src/lib/server/request-policy.test.ts pages/www/src/routes/qr-scan/scan-service.test.ts pages/www/src/lib/utils/qr-scan-identity.test.ts pages/www/src/lib/utils/lotto-round.test.ts

      - name: Check SDK
        run: bun run sdk check

      - name: Build SDK
        run: bun run sdk build

      - name: Check TrailBase adapter
        run: bun --cwd packages/trailbase-adapter -- type-check

      - name: Test TrailBase adapter
        run: bun --cwd packages/trailbase-adapter -- test --run
