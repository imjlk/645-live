name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRAILBASE_URL: https://trail.645.live
      PUBLIC_TRAILBASE_URL: https://trail.645.live
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check web app
        run: bun run www check

      - name: Test news generation
        run: node --test scripts/news/generate-news-content.test.mjs

      - name: Validate news scheduler
        working-directory: workers/news-scheduler-645-live
        run: |
          bun run check
          bun run test
          bun run deploy:dry-run

      - name: Test public data build retries
        run: node --test pages/www/src/lib/trailbase/read-retry.test.mjs scripts/ssg/public-data.test.mjs

      - name: Build web app
        run: bun run www build

      - name: Validate OG renderer
        run: |
          bun run og check
          bun --cwd packages/og-image-core check
          bun --cwd packages/og-image-core build
          bun test packages/og-image-core/src workers/og-645-live/src pages/www/src/lib/seo/og.test.ts pages/www/src/lib/server/og-proxy.test.ts
          bun run og deploy --dry-run

      - name: Test static serving and request boundaries
        run: |
          bun test pages/www/src/lib/generator/api.test.ts
          bun test pages/www/adapter/worker.test.ts pages/www/src/lib/server/request-policy.test.ts pages/www/src/routes/qr-scan/scan-service.test.ts pages/www/src/lib/utils/qr-scan-identity.test.ts pages/www/src/lib/utils/lotto-round.test.ts

      - name: Check SDK
        run: bun run sdk check

      - name: Build SDK
        run: bun run sdk build

      - name: Check TrailBase adapter
        run: bun --cwd packages/trailbase-adapter -- type-check

      - name: Test TrailBase adapter
        run: bun --cwd packages/trailbase-adapter -- test --run

  miniapp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-wasip2
          components: rustfmt
      - run: bun install --frozen-lockfile
      - name: Check and test the native app
        run: |
          bun run miniapp:check
          bun run miniapp:test
          bunx biome check apps/toss packages/lotto-core
      - name: Build the native miniapp
        env:
          LOTTO_APP_ENV: production
        run: bun run toss build
      - name: Check WASM
        run: |
          cargo fmt --manifest-path services/trailbase/miniapp-guest/Cargo.toml -- --check
          cargo test --manifest-path services/trailbase/miniapp-guest/Cargo.toml --locked
      - name: Exercise real TrailBase subscriptions
        run: |
          docker build -f services/trailbase/Dockerfile -t 645-trailbase:miniapp .
          python3 scripts/miniapp/smoke.py --fresh-only
          python3 scripts/miniapp/smoke.py --bots-only
          python3 scripts/miniapp/promotion-smoke.py
          python3 scripts/miniapp/local-smoke.py
          python3 scripts/miniapp/feed-smoke.py
          python3 scripts/miniapp/web-smoke.py
          python3 scripts/miniapp/generation-ad-smoke.py
          python3 scripts/miniapp/generation-archive-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: 645-live-miniapp
          path: apps/toss/645-live.ait
          if-no-files-found: error
          retention-days: 7
