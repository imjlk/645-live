name: Sampo release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sampo-toss-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      published: ${{ steps.sampo.outputs.published }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require current main and successful CI
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          SHA=$(git rev-parse HEAD)
          if [ "$SHA" != "$(git rev-parse origin/main)" ]; then
            echo 'A newer main commit will run the release workflow.'
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&per_page=100" > "$RUNNER_TEMP/toss-ci.json"
          jq -e --arg sha "$SHA" 'any(.workflow_runs[]; .head_sha == $sha and .status == "completed" and .conclusion == "success")' "$RUNNER_TEMP/toss-ci.json"
          git checkout -B main "$SHA"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Create release PR or publish the merged version
        if: steps.ready.outputs.ready == 'true'
        id: sampo
        uses: bruits/sampo/crates/sampo-github-action@d3f4020892ba2a8fd56298e417053bb86736fa88 # cargo-sampo-github-action-v0.19.0
        with:
          command: auto
          base-branch: main
          pr-branch: release/toss
          pr-title: 'chore: release 645 번호 생성기'
          create-github-release: true
          open-discussion: false
          github-token: ${{ github.token }}
      - name: Preserve dependency versions and verify the release PR
        if: steps.sampo.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN-created PRs need an explicit workflow dispatch.
        run: |
          set -euo pipefail
          git checkout release/toss
          bun scripts/miniapp/release.mjs sync-lock
          bun install --frozen-lockfile
          bunx biome check apps/toss/package.json
          if ! git diff --quiet -- bun.lock; then
            git add bun.lock
            git commit -m 'chore(release): preserve reviewed dependency resolutions'
            git push origin HEAD:release/toss
          fi
          gh workflow run ci.yml --ref release/toss
      - name: Resolve the published miniapp tag
        if: steps.sampo.outputs.published == 'true'
        id: version
        run: bun scripts/miniapp/release.mjs describe

  submit:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/ait-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      AIT_API_KEY: ${{ secrets.AIT_API_KEY }}
