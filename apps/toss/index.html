<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="data:," />
		<title>645 번호 생성기</title>
		<style>
			html, body, #root { height: 100%; margin: 0; width: 100%; }
			body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; }
			#root { display: flex; flex-direction: column; }
			/* Match the generator's frame without waiting for the app bundle or fonts. */
			.startup { width: 100%; max-width: 640px; padding: 20px; box-sizing: border-box; margin: 0 auto; }
			.startup-line, .startup-ball, .startup-action { background: #f2f4f6; border-radius: 8px; }
			.startup-line { height: 16px; width: 36%; margin-bottom: 24px; }
			.startup-title { height: 32px; width: 65%; margin-bottom: 16px; }
			.startup-copy { width: 90%; margin-bottom: 24px; }
			.startup-balls { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 20px; }
			.startup-ball { width: min(14%, 52px); aspect-ratio: 1; border-radius: 50%; }
			.startup-action { height: 56px; }
		</style>
		<script>
			// Preserve visibility before JS arrives; background time is not a slow foreground launch.
			(() => {
				const state = { hidden: document.hidden, stop: () => document.removeEventListener("visibilitychange", hide) };
				const hide = () => { if (document.hidden) state.hidden = true; };
				window.__lottoStartup = state;
				document.addEventListener("visibilitychange", hide);
			})();
		</script>
	</head>
	<body>
		<div id="root">
			<div class="startup" role="status" aria-label="화면 준비 중" aria-busy="true">
				<div aria-hidden="true">
					<div class="startup-line"></div>
					<div class="startup-line startup-title"></div>
					<div class="startup-line startup-copy"></div>
					<div class="startup-balls">
						<div class="startup-ball"></div><div class="startup-ball"></div><div class="startup-ball"></div>
						<div class="startup-ball"></div><div class="startup-ball"></div><div class="startup-ball"></div>
					</div>
					<div class="startup-action"></div>
				</div>
			</div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
