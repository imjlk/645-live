[package]
name = "lotto-miniapp"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trailbase-wasm = "0.6.1"
trailbase-guest-common = { path = "../../../vendor/trailbase-apps-in-toss-kit/crates/trailbase-guest-common" }
trailbase-toss-identity = { path = "../../../vendor/trailbase-apps-in-toss-kit/crates/trailbase-toss-identity" }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
