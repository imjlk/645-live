version: '3.8'

services:
  trailbase:
    build:
      context: ../..
      dockerfile: services/trailbase/Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./traildepot:/app/traildepot
    environment:
      - TRAILBASE_AUTH_BASE_URL=${TRAILBASE_AUTH_BASE_URL:-http://127.0.0.1:4000}
      - TRAILBASE_BOOTSTRAP_TIMING=${TRAILBASE_BOOTSTRAP_TIMING:-false}
      - CORS_ALLOWED_ORIGINS=https://www.645.live,https://645.live
      - BACKFILL_ON_STARTUP=true
      - BACKFILL_DRAWS=true
      - BACKFILL_DRAW_LATEST_ROUNDS=30
      - BACKFILL_STORES=true
      - BACKFILL_STORE_LATEST_ROUNDS=10
      - BACKFILL_STRICT=false
      - RUNTIME_THREADS=1
