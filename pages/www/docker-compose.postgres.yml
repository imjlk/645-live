services:
  db:
    image: postgres:17-alpine
    container_name: 645live-www-postgres
    restart: unless-stopped
    ports:
      - "50101:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - 645live_www_pgdata:/var/lib/postgresql/data

volumes:
  645live_www_pgdata:
