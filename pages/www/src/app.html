<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml" />
	<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	<!-- <link rel="preload" href="/assets/fonts/SUIT-Variable.woff2" as="font" type="font/woff2" crossorigin> -->
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="manifest" href="/manifest.json" />
	<meta name="theme-color" content="#ffffff" />
	<script>
		(() => {
			let preference = "system";
			try { preference = localStorage.getItem("645-theme") || "system"; } catch {}
			const theme = preference === "light" || preference === "dark"
				? preference : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
			document.documentElement.dataset.theme = theme;
			document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#131c29" : "#ffffff";
		})();
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
	
</body>

</html>
